[workspace]
name = "squiggy-positron"
version = "0.1.0"
description = "Positron extension for visualizing Oxford Nanopore sequencing data"
authors = ["Jay Hesselberth <jay.hesselberth@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tasks]
# === Setup ===
# Note: Run 'npm install' manually after 'pixi install' or use task below
setup = "npm install"
# === Version Management ===
sync = "node scripts/sync-version.js"
# === Main Development Workflow ===
dev = "npm run watch"
test = { depends-on = ["test-py", "test-ts"] }
check = { depends-on = ["format-check", "lint", "test"] }
build = "npm run package"
clean = "rm -rf build/ .pytest_cache/ .ruff_cache/ site/ squiggy.egg-info/ squiggy/__pycache__/ src/squiggy.egg-info/ src/squiggy/ test-*/ tests/__pycache__/ .DS_Store"
docs = "pixi run -e docs docs-serve"
docs-build = "pixi run -e docs docs-build"
# === Granular Tasks ===
# TypeScript
compile = "npm run compile"
test-ts = "npm test"
lint-ts = "npm run lint"
format-ts = "npm run format"
format-check-ts = "npm run format:check"
# Python
test-py = "python -m pytest tests/ -v"
lint-py = "ruff check squiggy/ tests/"
format-py = "ruff format squiggy/ tests/"
format-check-py = "ruff format --check squiggy/ tests/"
# Combined
lint = { depends-on = ["format-py", "format-ts", "lint-py", "lint-ts"] }
format = { depends-on = ["format-py", "format-ts"] }
format-check = { depends-on = ["format-check-py", "format-check-ts"] }

[dependencies]
python = "3.12.*"
nodejs = ">=22"
# Conda packages
numpy = ">=2.0"
pillow = ">=12.0"
pytest = ">=9.0"
pytest-cov = ">=7.0"
ruff = ">=0.17"

[pypi-dependencies]
# PyPI-only packages
bokeh = ">=3.10"
escapepod = ">=0.32"  # POD5 reader (rnabioco/escapepod-rs)
pysam = ">=0.24.1"
selenium = ">=4.51"

# Documentation feature
[feature.docs.dependencies]
python = ">=3.10"

[feature.docs.pypi-dependencies]
# Zensical reads zensical.toml directly. Note: it does not yet support the
# mkdocstrings or mike plugins, so the API reference is hand-authored (docs/api.md)
# and versioning is not wired up. Revisit when Zensical ships plugin support.
zensical = "*"

[feature.docs.tasks]
docs-build = "zensical build"
docs-serve = "zensical serve"

[environments]
docs = { features = ["docs"], solve-group = "default" }
