name: Update pixi lockfile

# Dependabot does not support pixi, so this job refreshes pixi.lock weekly
# (within the ranges in pixi.toml) and opens/updates a single PR.
#
# PRs created with the default GITHUB_TOKEN do not trigger other workflows, so
# the Tests/Build checks would not run on them. Set a repository secret
# PIXI_UPDATE_TOKEN (fine-grained PAT or GitHub App token with contents +
# pull-requests write) to have CI run automatically; without it, close and
# reopen the PR (or push to its branch) to start CI.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pixi-update:
    name: pixi update
    if: github.repository == 'rnabioco/squiggy-positron'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: latest
          run-install: false

      - name: Update lockfile
        run: |
          set -o pipefail
          pixi update --json | pixi exec pixi-diff-to-markdown >> diff.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PIXI_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update pixi.lock"
          title: "chore(deps): update pixi.lock"
          body-path: diff.md
          branch: chore/update-pixi-lock
          base: main
          labels: dependencies
          add-paths: pixi.lock
          delete-branch: true
