name: Build Extension

on:
    push:
        branches:
            - main
        tags:
            - "v*"
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    build:
        name: Build .vsix
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup pixi
              uses: prefix-dev/setup-pixi@v0.11.0
              with:
                  pixi-version: latest
                  cache: true

            - name: Install dependencies
              run: pixi install

            - name: Setup Node.js with npm cache
              uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install npm dependencies
              run: npm ci

            - name: Build extension
              run: pixi run build

            - name: Upload .vsix artifact
              uses: actions/upload-artifact@v7
              with:
                  name: squiggy-positron-extension
                  path: "build/*.vsix"
                  retention-days: 30
